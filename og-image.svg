      <stop offset="0%" stop-color="#C4993A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#142414" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0D1A0D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#142414" stop-opacity="0"/>
    </radialGradient>
    <!-- 병 그라디언트 -->
    <linearGradient id="capG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#D4A94A"/>
      <stop offset="50%" stop-color="#C4993A"/>
      <stop offset="100%" stop-color="#7A5818"/>
    </linearGradient>
    <linearGradient id="bottleG" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0D1A0D"/>
      <stop offset="40%" stop-color="#1C3A1C"/>
      <stop offset="70%" stop-color="#142414"/>
      <stop offset="100%" stop-color="#0A0E0A"/>
    </linearGradient>
    <linearGradient id="labelG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#142414"/>
      <stop offset="100%" stop-color="#0D1A0D"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(196,153,58,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
