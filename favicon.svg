  <!-- 우측 세근 분기 -->
  <path d="M 319 400 C 337 411 356 422 370 436"
        fill="none" stroke="#C4993A" stroke-width="5.5" stroke-linecap="round"/>
  <!-- 우측 세근 끝 가지 -->
  <path d="M 370 436 C 378 444 383 450 386 456"
        fill="none" stroke="#C4993A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 370 436 C 364 444 362 451 364 457"
        fill="none" stroke="#C4993A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 우측 주근 끝 가지 -->
  <path d="M 338 444 C 346 451 350 457 352 462"
        fill="none" stroke="#C4993A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 338 444 C 331 451 329 458 331 463"
        fill="none" stroke="#C4993A" stroke-width="4" stroke-linecap="round"/>

  <!-- ====== 구분선 ====== -->
  <line x1="108" y1="452" x2="404" y2="452" stroke="#C4993A" stroke-width="0.75" opacity=".38"/>

  <!-- ====== 진본삼 텍스트 ====== -->
  <text x="256" y="494"
        text-anchor="middle"
        font-family="'Noto Serif KR','Apple Myungjo','Batang','Noto Serif CJK KR','PMingLiU',serif"
        font-size="42"
        font-weight="500"
        letter-spacing="6"
        fill="#C4993A">진본삼</text>
</svg>
