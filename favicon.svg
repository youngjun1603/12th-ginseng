    <linearGradient id="stem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88820"/>
      <stop offset="50%" stop-color="#D4A83A"/>
      <stop offset="100%" stop-color="#B88820"/>
    </linearGradient>
  </defs>

