  <!-- 좌측 주근 끝 가지 -->
  <path d="M 174 444 C 166 451 162 457 160 462"
        fill="none" stroke="#C4993A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 174 444 C 181 451 183 458 181 463"
