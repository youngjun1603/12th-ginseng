  <!-- ====== STEM ====== -->
  <path d="M 256 173 L 256 215" stroke="url(#stem)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- 외측 잎 줄기 -->
  <path d="M 256 191 Q 226 189 205 181" stroke="#C4993A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M 256 191 Q 286 189 307 181" stroke="#C4993A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- 내측 잎 줄기 -->
  <path d="M 256 183 Q 242 180 230 170" stroke="#C4993A" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M 256 183 Q 270 180 282 170" stroke="#C4993A" stroke-width="2.1" stroke-linecap="round" fill="none"/>

  <!-- ====== ROOT NECK ====== -->
  <path d="M 244 212 C 239 217 237 226 237 236 L 275 236 C 275 226 273 217 268 212 Z"
