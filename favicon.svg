<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#1A3A1A"/>
      <stop offset="100%" stop-color="#080E08"/>
    </radialGradient>
    <radialGradient id="root" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ECC84E"/>
      <stop offset="40%" stop-color="#CCA03C"/>
      <stop offset="75%" stop-color="#B08428"/>
      <stop offset="100%" stop-color="#7C5C10"/>
    </radialGradient>
    <linearGradient id="leaf" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#2A5E28"/>
      <stop offset="100%" stop-color="#0A200A"/>
